name: AeroCombat CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python ${{ matrix.python-version }} Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Sistem Bağımlılıkları (OpenCV)
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Python Bağımlılıklarını Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: pytest ile Birim Testleri Çalıştır
      run: |
        python -m pytest tests/ -v

    - name: Uçuş Öncesi Kontrol (Pre-flight Check) Doğrulaması
      run: |
        python tools/preflight_check.py

    - name: Sentetik Veri Seti Üretim Testi
      run: |
        python tools/synthetic_dataset_generator.py --count 5 --output test_dataset
